<!DOCTYPE html>
<html lang="en">
<head>
    <title>Payment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #333;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .product-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
        }
        .btn-pay {
            background: #ff9800;
            color: white;
            font-weight: bold;
        }
        .btn-pay:hover {
            background: #e68900;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row">

        <!-- LEFT: ITEMS -->
        <div class="col-md-8">
            <div class="card p-4">
                <h4 class="mb-4">🛒 Your Cart Payment</h4>

                {% for i in items_data %}
                <div class="d-flex align-items-center mb-3 border-bottom pb-3">
                    <img src="{{ url_for('static', filename='uploads/' + i[5]) }}" class="product-img me-3">

                    <div class="flex-grow-1">
                        <h6>{{ i[1] }}</h6>
                        <small>Quantity: {{ i[2] }}</small>
                    </div>

                    <div>
                        ₹ {{ i[6] }}
                    </div>
                </div>
                {% endfor %}

            </div>
        </div>

        <!-- RIGHT: BILL -->
        <div class="col-md-4">
            <div class="card p-4">

                <h5 class="mb-3">🧾 Bill Summary</h5>

                <div class="d-flex justify-content-between">
                    <span>Subtotal</span>
                    <span>₹ {{ sub_total }}</span>
                </div>

                <div class="d-flex justify-content-between">
                    <span>Delivery</span>
                    <span>₹ {{ delivery }}</span>
                </div>

                <div class="d-flex justify-content-between">
                    <span>Tax</span>
                    <span>₹ {{ tax }}</span>
                </div>

                <hr>

                <div class="d-flex justify-content-between fw-bold">
                    <span>Grand Total</span>
                    <span>₹ {{ grand_total }}</span>
                </div>

                <form action="/success_cart" method="POST">
                    <input type="hidden" name="grand_total" value="{{ grand_total }}">
                    
                    <button type="submit" class="btn btn-pay w-100 mt-3">
                        💳 Pay Now
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

</body>
</html>
